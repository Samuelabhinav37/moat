<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="blockedPageTitle">Page blocked by Moat</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme-boot.js"></script>
    <!-- Shown in place of Chrome's "blocked by an extension" error when one of
         Moat's lists stops a whole page (background/blockedPage.ts). Laid out
         like Chrome's Safe Browsing page: what happened in plain words, "Go
         back" first, the rest under Details. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
      }
      main {
        box-sizing: border-box;
        max-width: 600px;
        margin: 0 auto;
        padding: 16vh 24px 48px;
      }
      .mark {
        width: 56px;
        height: 56px;
        color: var(--muted);
      }
      body[data-kind="danger"] .mark {
        color: var(--danger);
      }
      .by {
        margin: 22px 0 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 26px;
        line-height: 1.25;
        font-weight: 700;
      }
      .why {
        margin: 0 0 8px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--fg);
      }
      .host {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: 28px;
      }
      .actions button {
        min-height: 36px;
        padding: 0 16px;
        font-size: 14px;
      }
      button.link {
        border: 0;
        background: none;
        padding: 0 4px;
        color: var(--accent);
        font-weight: 600;
      }
      button.link:hover {
        text-decoration: underline;
      }
      #details {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      #details dl {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 6px 16px;
        margin: 0 0 14px;
      }
      #details dt {
        color: var(--muted);
      }
      #details dd {
        margin: 0;
        color: var(--fg);
        overflow-wrap: anywhere;
      }
      #details a {
        color: var(--accent);
      }
      .risk {
        margin: 0 0 14px;
        color: var(--fg);
      }
      .risk .link {
        padding: 0;
        font-size: inherit;
      }
      .detail-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
      }
      @media (max-width: 480px) {
        main {
          padding-top: 10vh;
        }
        h1 {
          font-size: 22px;
        }
        #details dl {
          grid-template-columns: minmax(0, 1fr);
          gap: 2px;
        }
        #details dd {
          margin-bottom: 8px;
        }
      }
    </style>
  </head>
  <body data-kind="ads">
    <main>
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l7.5 3v5.5c0 4.7-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.8-7.5-9.5V6z" />
        <path d="M12 8.5v4M12 15.5v.2" />
      </svg>
      <p class="by" data-i18n="blockedBy">Blocked by Moat</p>
      <h1 id="title"></h1>
      <p class="why" id="why"></p>
      <div class="actions">
        <button type="button" class="primary" id="go-back" data-i18n="blockedGoBack">Go back</button>
        <!-- Ad, tracker and your own blocks: a plain way through, for this visit. -->
        <button type="button" id="open-anyway" hidden data-i18n="blockedOpenAnyway">Open anyway</button>
        <button type="button" class="link" id="show-details" aria-expanded="false" aria-controls="details" data-i18n="blockedDetails">Details</button>
      </div>
      <section id="details" hidden>
        <dl>
          <dt data-i18n="blockedAddress">Address</dt>
          <dd id="address"></dd>
          <dt data-i18n="blockedStoppedBy">Stopped by</dt>
          <dd id="list-name"></dd>
        </dl>
        <!-- Dangerous sites: the way through sits here, behind Details, with
             Chrome's "not recommended" wording (Safe Browsing does the same). -->
        <p class="risk" id="danger-proceed" hidden>
          <span data-i18n="blockedRiskNote">If you understand the risk, you can open this site for this visit.</span>
          <button type="button" class="link" id="open-dangerous" data-i18n="blockedOpenDangerous">Open it (not recommended)</button>
        </p>
        <p class="risk" id="open-failed" role="status" hidden data-i18n="blockedOpenFailed">Moat couldn't open this site. Try again from the address bar.</p>
        <div class="detail-links">
          <a href="#" id="report" target="_blank" rel="noopener" data-i18n="blockedReport">Report a mistake</a>
          <a href="#" id="settings-link" target="_blank" rel="noopener"></a>
        </div>
      </section>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
