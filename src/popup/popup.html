<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        width: 260px;
        padding: 14px;
      }
      .count {
        font-size: 28px;
        font-weight: 700;
      }
      .card + .card {
        margin-top: 10px;
      }
      footer {
        margin-top: 10px;
        text-align: right;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Silent Adblock</h1>
    <div class="card">
      <div class="muted">Blocked on this page</div>
      <div class="count" id="count">0</div>
    </div>
    <div class="card" id="site-card">
      <div class="row">
        <div>
          <div>Protection on <span id="hostname" class="muted"></span></div>
        </div>
        <label class="switch">
          <input type="checkbox" id="site-toggle" />
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
    </div>
    <footer><a href="#" id="open-options">Settings</a></footer>
    <script src="popup.js"></script>
  </body>
</html>
