<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        width: 260px;
        padding: 16px;
      }
      [hidden] {
        display: none !important;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      .brand img {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        flex: none;
      }
      .brand .mark {
        font-weight: 600;
        font-size: 14.5px;
      }

      .stat-hero {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 14px;
        white-space: nowrap;
      }
      .stat-hero .n {
        font: 28px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-weight: 600;
      }
      .stat-hero .l {
        font-size: 11px;
        color: var(--muted);
      }

      .paused-banner {
        background: rgba(217, 168, 119, 0.12);
        border: 1px solid #4a3a2c;
        color: #d9a877;
        font-size: 11px;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 12px;
      }

      .breakdown {
        display: flex;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 14px;
        overflow: hidden;
      }
      .breakdown .seg {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 4px;
        text-align: center;
      }
      .breakdown .seg + .seg {
        border-left: 1px solid var(--border);
      }
      .breakdown .n {
        font: 15px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-weight: 600;
      }
      .breakdown .l {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 9.5px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .breakdown .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        flex: none;
      }
      .breakdown .dot.ads {
        background: var(--accent);
      }
      .breakdown .dot.trackers {
        background: #3d7f68;
      }
      .breakdown .dot.popups {
        background: var(--danger);
      }

      #company-details {
        margin: -6px 0 14px;
        font-size: 11.5px;
      }
      #company-details summary {
        cursor: pointer;
        color: var(--muted);
        user-select: none;
      }
      #company-list {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #company-list li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      #company-list .n {
        font: 11px ui-monospace, "SFMono-Regular", Consolas, monospace;
        color: var(--muted);
      }

      .host {
        font-size: 12.5px;
        font-weight: 500;
      }
      .site-state {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .site-state i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }
      .site-state.paused i {
        background: #d9a877;
      }

      .actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .actions button {
        flex: 1;
      }

      footer {
        margin-top: 12px;
        text-align: right;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/icon48.png" alt="" />
      <div class="mark">Moat</div>
    </div>

    <div id="stats" hidden>
      <div class="stat-hero">
        <div class="n" id="count">0</div>
        <div class="l">Blocked on this page</div>
      </div>

      <div class="breakdown">
        <div class="seg"><span class="n" id="count-ads">0</span><span class="l"><i class="dot ads"></i>Ads</span></div>
        <div class="seg"><span class="n" id="count-trackers">0</span><span class="l"><i class="dot trackers"></i>Trackers</span></div>
        <div class="seg"><span class="n" id="count-popups">0</span><span class="l"><i class="dot popups"></i>Popups</span></div>
      </div>

      <details id="company-details" hidden>
        <summary>By company</summary>
        <ul id="company-list"></ul>
      </details>
    </div>

    <div class="paused-banner" id="paused-banner" hidden>
      Paused on <span id="paused-hostname"></span>. Reload the page to see it unblocked.
    </div>

    <div class="card" id="site-card">
      <div class="row">
        <div>
          <div class="host" id="hostname"></div>
          <div class="site-state" id="site-state"><i></i><span id="site-state-text">protected</span></div>
        </div>
        <label class="switch">
          <input type="checkbox" id="site-toggle" />
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
    </div>

    <div class="actions">
      <button id="reload-page" class="primary" hidden>Reload page</button>
      <button id="start-picker" class="danger">Block an element…</button>
    </div>

    <footer><a href="#" id="open-options">Settings</a></footer>
    <script src="popup.js"></script>
  </body>
</html>
