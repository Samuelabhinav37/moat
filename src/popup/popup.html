<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        width: 260px;
        padding: 20px;
        background: linear-gradient(180deg, #16151a 0%, #34322d 100%);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      [hidden] {
        display: none !important;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .brand svg {
        flex: none;
      }
      .brand .mark {
        font-weight: 700;
        font-size: 19px;
        letter-spacing: -0.01em;
      }
      .brand a {
        margin-left: auto;
        font-size: 12.5px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.75);
      }

      .stat-hero {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 14px 16px;
        text-align: center;
        margin-bottom: 14px;
      }
      .stat-hero .n {
        font: 34px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-weight: 700;
      }
      .stat-hero .l {
        font-size: 11.5px;
        opacity: 0.85;
        margin-top: 4px;
      }
      .stat-hero .level {
        font-size: 10.5px;
        opacity: 0.65;
        margin-top: 2px;
      }
      .stat-hero .level:empty {
        display: none;
      }

      .paused-banner {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.75);
        font-size: 11px;
        border-radius: 10px;
        padding: 8px 10px;
        margin-bottom: 12px;
      }

      .notice {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.85);
        font-size: 11px;
        line-height: 1.5;
        border-radius: 10px;
        padding: 8px 10px;
        margin-bottom: 12px;
      }
      .notice a {
        color: inherit;
        font-weight: 600;
      }

      .breakdown {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .breakdown .seg {
        flex: 1;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 9px 4px;
        text-align: center;
      }
      .breakdown .n {
        font: 15px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-weight: 700;
      }
      .breakdown .l {
        font-size: 9px;
        opacity: 0.8;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .breakdown .dot {
        display: none;
      }

      #company-details {
        margin: 0 0 14px;
        font-size: 11.5px;
      }
      #company-details summary {
        cursor: pointer;
        color: rgba(255, 255, 255, 0.6);
        user-select: none;
      }
      #company-list {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #company-list li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: rgba(255, 255, 255, 0.75);
      }
      #company-list .n {
        font: 11px ui-monospace, "SFMono-Regular", Consolas, monospace;
        color: rgba(255, 255, 255, 0.55);
      }

      .card {
        background: #ffffff;
        border: none;
        border-radius: 14px;
        padding: 12px 14px;
      }
      .host {
        font-size: 13.5px;
        font-weight: 700;
        color: #38373b;
      }
      .site-state {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
        font-weight: 600;
        color: #3f78e0;
        margin-top: 2px;
      }
      .site-state i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3f78e0;
        flex: none;
      }
      .site-state.paused {
        color: #737278;
      }
      .site-state.paused i {
        background: #737278;
      }

      .switch .track {
        background: #dcdcdc;
      }
      .switch .thumb {
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .switch input:checked + .track {
        background: var(--on);
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .actions button {
        flex: 1;
        border: none;
        border-radius: 8px;
        padding: 8px 10px;
        font-weight: 600;
        font-size: 12.5px;
      }
      .actions button.secondary {
        background: rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.85);
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
        <defs>
          <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" /></filter>
        </defs>
        <circle cx="28.32" cy="5.85" r="3.64" fill="white" opacity="0.5" filter="url(#g)" />
        <line x1="28.32" y1="5.85" x2="16.73" y2="14.55" stroke="rgba(220,225,235,0.42)" stroke-width="0.7" />
        <line x1="16.73" y1="14.55" x2="9.48" y2="26.15" stroke="rgba(220,225,235,0.42)" stroke-width="0.7" />
        <line x1="16.73" y1="14.55" x2="3.68" y2="10.2" stroke="rgba(220,225,235,0.42)" stroke-width="0.7" />
        <circle cx="28.32" cy="5.85" r="3.12" fill="rgba(255,255,255,1)" />
        <circle cx="16.73" cy="14.55" r="2.21" fill="rgba(255,255,255,0.85)" />
        <circle cx="9.48" cy="26.15" r="1.43" fill="rgba(255,255,255,0.55)" />
        <circle cx="3.68" cy="10.2" r="1.43" fill="rgba(255,255,255,0.5)" />
      </svg>
      <div class="mark">Moat</div>
      <a href="#" id="open-options" data-i18n="popupSettingsLink">Settings</a>
    </div>

    <div class="notice" id="onboarding-card" hidden>
      <span data-i18n="popupOnboardingCard"
        >Moat blocks ads and trackers automatically. Use the switch below to pause it on a
        site, or Settings to fine-tune.</span
      >
    </div>

    <div class="notice" id="update-notice" hidden>
      <span
        ><span data-i18n="popupUpdatePrefix">Updated to v</span><span id="update-version"></span
        ><span data-i18n="popupUpdateSeparator"> -- </span>
        <a
          href="https://github.com/Samuelabhinav37/moat/blob/master/CHANGELOG.md"
          target="_blank"
          rel="noopener"
          id="update-changelog-link"
          data-i18n="popupUpdateLinkText"
          >see what's new</a
        ></span
      >
    </div>

    <div id="stats" hidden>
      <div class="stat-hero">
        <div class="n" id="count">0</div>
        <div class="l" data-i18n="popupBlockedOnPage">Blocked on this page</div>
        <div class="level" id="protection-level"></div>
      </div>

      <div class="breakdown">
        <div class="seg"><span class="n" id="count-ads">0</span><span class="l"><i class="dot ads"></i><span data-i18n="popupAds">Ads</span></span></div>
        <div class="seg"><span class="n" id="count-trackers">0</span><span class="l"><i class="dot trackers"></i><span data-i18n="popupTrackers">Trackers</span></span></div>
        <div class="seg"><span class="n" id="count-popups">0</span><span class="l"><i class="dot popups"></i><span data-i18n="popupPopups">Popups</span></span></div>
      </div>

      <details id="company-details" hidden>
        <summary data-i18n="popupByCompany">By company</summary>
        <ul id="company-list"></ul>
      </details>
    </div>

    <div class="paused-banner" id="paused-banner" hidden>
      <span data-i18n="popupPausedPrefix">Paused on </span><span id="paused-hostname"></span
      ><span data-i18n="popupPausedSuffix">. Reload the page to see it unblocked.</span>
    </div>

    <div class="card" id="site-card">
      <div class="row">
        <div>
          <div class="host" id="hostname"></div>
          <div class="site-state" id="site-state"><i></i><span id="site-state-text" data-i18n="popupProtected">protected</span></div>
        </div>
        <label class="switch">
          <input type="checkbox" id="site-toggle" aria-labelledby="hostname" />
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
    </div>

    <div class="actions">
      <button id="reload-page" class="secondary" hidden data-i18n="popupReloadPage">Reload page</button>
      <button id="start-picker" class="secondary" data-i18n="popupBlockElement">Block an element…</button>
    </div>
    <div class="actions">
      <button id="report-problem" class="secondary" hidden data-i18n="popupReportProblem">Report a problem…</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
