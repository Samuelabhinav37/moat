<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_frame.css" />
<style>
  /* Real popup.html CSS, verbatim (see src/popup/popup.html), scoped under
     .popup-panel so it can sit inside this composite page without clashing
     with the frame's own styles. */
  .popup-panel {
    --s1: rgba(255, 255, 255, 0.07);
    --s2: rgba(255, 255, 255, 0.12);
    --edge: rgba(255, 255, 255, 0.12);
    --t1: #f2f3f5;
    --t2: rgba(255, 255, 255, 0.82);
    --t3: rgba(255, 255, 255, 0.55);
    --on: #43c13a;
    position: absolute;
    top: 60px;
    right: 60px;
    width: 260px;
    padding: 20px;
    background: #1b191d;
    color: var(--t1);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(10,9,14,.35), 0 2px 8px rgba(10,9,14,.2);
  }
  .popup-panel .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .popup-panel .brand svg { flex: none; }
  .popup-panel .brand .mark { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  .popup-panel .brand a { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--t2); text-decoration: none; }
  .popup-panel .stat-hero { background: var(--s2); border-radius: 12px; padding: 14px 16px; text-align: center; margin-bottom: 14px; }
  .popup-panel .stat-hero .n { font: 32px/1 ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 700; }
  .popup-panel .stat-hero .l { font-size: 11.5px; color: var(--t2); margin-top: 4px; }
  .popup-panel .stat-hero .level { font-size: 10.5px; color: var(--t3); margin-top: 3px; }
  .popup-panel .breakdown { display: flex; gap: 8px; margin-bottom: 14px; }
  .popup-panel .breakdown .seg { flex: 1; background: var(--s2); border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; text-align: center; }
  .popup-panel .breakdown .n { font: 15px/1 ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 700; }
  .popup-panel .breakdown .l { font-size: 10px; color: var(--t2); text-transform: uppercase; letter-spacing: 0.04em; }
  .popup-panel .card { background: #ffffff; border: none; border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .popup-panel .card .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .popup-panel .host { font-size: 13.5px; font-weight: 700; color: #38373b; }
  .popup-panel .site-state { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: #3572d6; margin-top: 2px; }
  .popup-panel .site-state i { width: 6px; height: 6px; border-radius: 50%; background: #3572d6; flex: none; }
  .popup-panel .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .popup-panel .switch .track { position: absolute; inset: 0; background: var(--on); border-radius: 999px; }
  .popup-panel .switch .thumb { position: absolute; top: 2px; left: 18px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .popup-panel .actions button {
    width: 100%; border: none; border-radius: 8px; padding: 9px 10px;
    font-weight: 600; font-size: 12.5px; background: var(--s2); color: var(--t2);
    font-family: inherit;
  }

  .headline-scrim {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 320px;
    background: linear-gradient(180deg, rgba(222,221,226,0) 0%, rgba(222,221,226,.85) 40%, #dedde2 75%);
  }
  .headline {
    position: absolute;
    left: 60px; bottom: 56px;
    max-width: 660px;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .headline h1 { font-size: 42px; font-weight: 700; color: #17161b; margin: 0 0 12px; letter-spacing: -0.01em; line-height: 1.15; }
  .headline p { font-size: 26px; color: #45444c; margin: 0; line-height: 1.4; }
</style>
</head>
<body>
  <div class="page-fake">
    <div class="fake-header">
      <div class="fake-logo"></div>
      <div class="fake-nav"><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="fake-body">
      <div class="fake-card"></div><div class="fake-card"></div><div class="fake-card"></div>
      <div class="fake-card"></div><div class="fake-card"></div><div class="fake-card"></div>
    </div>
  </div>

  <div class="headline-scrim"></div>
  <div class="headline">
    <h1>128 things this page tried to do without asking.</h1>
    <p>Moat blocked every one of them, on your device, before they loaded.</p>
  </div>

  <div class="browser-toolbar">
    <div class="traffic-lights"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <div class="nav-icons">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 3L5 8l5 5"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".4"><path d="M6 3l5 5-5 5"/></svg>
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.6 8A5.6 5.6 0 112.8 5.2M2.4 2v3.6h3.6"/></svg>
    </div>
    <div class="address-pill">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3.5" y="7" width="9" height="6.5" rx="1.2"/><path d="M5.5 7V4.8a2.5 2.5 0 015 0V7"/></svg>
      example.com
    </div>
    <div class="toolbar-icons">
      <div class="ext-icon-wrap">
        <svg width="26" height="26" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
          <rect width="32" height="32" rx="7" fill="#030307" />
          <line x1="24" y1="8" x2="16" y2="16" stroke="rgba(255,255,255,.55)" stroke-width="2" />
          <line x1="16" y1="16" x2="9" y2="25" stroke="rgba(255,255,255,.55)" stroke-width="2" />
          <line x1="16" y1="16" x2="5.5" y2="11" stroke="rgba(255,255,255,.55)" stroke-width="2" />
          <circle cx="24" cy="8" r="4" fill="#fff" />
          <circle cx="16" cy="16" r="2.8" fill="rgba(255,255,255,.85)" />
          <circle cx="9" cy="25" r="2.2" fill="rgba(255,255,255,.7)" />
          <circle cx="5.5" cy="11" r="2" fill="rgba(255,255,255,.62)" />
        </svg>
        <div class="ext-badge">128</div>
      </div>
    </div>
  </div>

  <div class="popup-panel">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
        <rect width="32" height="32" rx="7" fill="#030307" />
        <line x1="24" y1="8" x2="16" y2="16" stroke="rgba(255,255,255,.55)" stroke-width="2" />
        <line x1="16" y1="16" x2="9" y2="25" stroke="rgba(255,255,255,.55)" stroke-width="2" />
        <line x1="16" y1="16" x2="5.5" y2="11" stroke="rgba(255,255,255,.55)" stroke-width="2" />
        <circle cx="24" cy="8" r="4" fill="#fff" />
        <circle cx="16" cy="16" r="2.8" fill="rgba(255,255,255,.85)" />
        <circle cx="9" cy="25" r="2.2" fill="rgba(255,255,255,.7)" />
        <circle cx="5.5" cy="11" r="2" fill="rgba(255,255,255,.62)" />
      </svg>
      <div class="mark">Moat</div>
      <a href="#">Settings</a>
    </div>
    <div class="stat-hero">
      <div class="n">128</div>
      <div class="l">Blocked on this page</div>
    </div>
    <div class="breakdown">
      <div class="seg"><span class="n">71</span><span class="l">Ads</span></div>
      <div class="seg"><span class="n">54</span><span class="l">Trackers</span></div>
      <div class="seg"><span class="n">3</span><span class="l">Popups</span></div>
    </div>
    <div class="card">
      <div class="row">
        <div>
          <div class="host">example.com</div>
          <div class="site-state"><i></i><span>protected</span></div>
        </div>
        <label class="switch"><span class="track"><span class="thumb"></span></span></label>
      </div>
    </div>
    <div class="actions"><button>Block an element…</button></div>
  </div>
</body>
</html>
