<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background: #1b191d;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #eceef0;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 56px; }
  .brand .mark { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .claims { display: flex; flex-direction: column; gap: 30px; align-items: center; }
  .claim { display: flex; align-items: center; gap: 18px; }
  .claim .x {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(250,109,109,.14);
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .claim .x svg { width: 18px; height: 18px; }
  .claim span { font-size: 42px; font-weight: 700; letter-spacing: -0.01em; }
  .foot { margin-top: 64px; font-size: 26px; color: #a7a1ac; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
      <rect width="32" height="32" rx="7" fill="#030307" />
      <line x1="24" y1="8" x2="16" y2="16" stroke="rgba(255,255,255,.55)" stroke-width="2" />
      <line x1="16" y1="16" x2="9" y2="25" stroke="rgba(255,255,255,.55)" stroke-width="2" />
      <line x1="16" y1="16" x2="5.5" y2="11" stroke="rgba(255,255,255,.55)" stroke-width="2" />
      <circle cx="24" cy="8" r="4" fill="#fff" />
      <circle cx="16" cy="16" r="2.8" fill="rgba(255,255,255,.85)" />
      <circle cx="9" cy="25" r="2.2" fill="rgba(255,255,255,.7)" />
      <circle cx="5.5" cy="11" r="2" fill="rgba(255,255,255,.62)" />
    </svg>
    <span class="mark">Moat</span>
  </div>
  <div class="claims">
    <div class="claim">
      <span class="x"><svg viewBox="0 0 16 16" fill="none" stroke="#fa6d6d" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></span>
      <span>No server.</span>
    </div>
    <div class="claim">
      <span class="x"><svg viewBox="0 0 16 16" fill="none" stroke="#fa6d6d" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></span>
      <span>No account.</span>
    </div>
    <div class="claim">
      <span class="x"><svg viewBox="0 0 16 16" fill="none" stroke="#fa6d6d" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></span>
      <span>No telemetry.</span>
    </div>
  </div>
  <p class="foot">Everything runs on your device. Open source, GPL-3.0.</p>
</body>
</html>
