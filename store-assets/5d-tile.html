<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 440px;
    height: 280px;
    overflow: hidden;
    background: #1b191d;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #eceef0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .mark { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .tagline { font-size: 15px; color: #a7a1ac; }
</style>
</head>
<body>
  <svg width="52" height="52" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
    <rect width="32" height="32" rx="7" fill="#030307" />
    <line x1="24" y1="8" x2="16" y2="16" stroke="rgba(255,255,255,.55)" stroke-width="2" />
    <line x1="16" y1="16" x2="9" y2="25" stroke="rgba(255,255,255,.55)" stroke-width="2" />
    <line x1="16" y1="16" x2="5.5" y2="11" stroke="rgba(255,255,255,.55)" stroke-width="2" />
    <circle cx="24" cy="8" r="4" fill="#fff" />
    <circle cx="16" cy="16" r="2.8" fill="rgba(255,255,255,.85)" />
    <circle cx="9" cy="25" r="2.2" fill="rgba(255,255,255,.7)" />
    <circle cx="5.5" cy="11" r="2" fill="rgba(255,255,255,.62)" />
  </svg>
  <div class="mark">Moat</div>
  <div class="tagline">Ads, trackers, and popups — blocked quietly.</div>
</body>
</html>
