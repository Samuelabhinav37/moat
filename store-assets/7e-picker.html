<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_frame.css" />
<style>
  /* Real popup.html CSS, verbatim (see src/popup/popup.html), scoped under
     .popup-panel so it can sit inside this composite page without clashing
     with the frame's own styles. */
  .picker-target {
    position: absolute;
    outline: 2px solid #e0b16f;
    background: rgba(224, 177, 111, 0.16);
    border-radius: 4px;
    /* Spotlight: a giant shadow outside this box's own bounds dims
       everything else on the page in one rule, no separate full-cover
       overlay (which would just muddy the highlighted element itself). */
    box-shadow: 0 0 0 9999px rgba(10,9,14,.6);
    z-index: 4;
    cursor: crosshair;
  }
  .picker-cursor {
    position: absolute;
    z-index: 6;
  }
  .picker-panel {
    position: absolute;
    z-index: 6;
    width: 280px;
    background: #1b191d;
    color: #eceef0;
    border: 1px solid #37343b;
    border-radius: 14px;
    padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    box-shadow: 0 18px 50px rgba(10,9,14,.4);
  }
  .picker-panel .ppl { font-size: 11px; color: #a7a1ac; margin-bottom: 4px; }
  .picker-panel .selector {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 13px;
    background: #111015;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 14px;
    word-break: break-all;
  }
  .picker-panel .prow { display: flex; gap: 8px; }
  .picker-panel .prow button {
    flex: 1; border-radius: 999px; padding: 8px 0; font: inherit; font-weight: 600; font-size: 12.5px; cursor: pointer;
  }
  .picker-panel .btn-primary { border: 1px solid #e0b16f; background: #e0b16f; color: #2c2408; }
  .picker-panel .btn-plain { border: 1px solid #37343b; background: transparent; color: #eceef0; }

  .headline-scrim {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 320px;
    background: linear-gradient(180deg, rgba(222,221,226,0) 0%, rgba(222,221,226,.85) 40%, #dedde2 75%);
  }
  .headline {
    position: absolute;
    left: 60px; bottom: 56px;
    max-width: 660px;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .headline h1 { font-size: 42px; font-weight: 700; color: #17161b; margin: 0 0 12px; letter-spacing: -0.01em; line-height: 1.15; }
  .headline p { font-size: 26px; color: #45444c; margin: 0; line-height: 1.4; }
</style>
</head>
<body>
  <div class="page-fake">
    <div class="fake-header">
      <div class="fake-logo"></div>
      <div class="fake-nav"><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="fake-body">
      <div class="fake-card"></div><div class="fake-card"></div><div class="fake-card"></div>
      <div class="fake-card"></div><div class="fake-card"></div><div class="fake-card"></div>
    </div>
  </div>

  <div class="picker-target" style="top: 176px; left: 40px; width: 381px; height: 220px;"></div>
  <svg class="picker-cursor" style="top: 200px; left: 60px;" width="26" height="26" viewBox="0 0 16 16" fill="#e0b16f" stroke="#1b191d" stroke-width="0.6">
    <path d="M3 2l10 4.2-4 1.6-1.6 4z" />
  </svg>

  <div class="picker-panel" style="top: 260px; left: 460px;">
    <p class="ppl">Element picker</p>
    <div class="selector">.promo-card--hero</div>
    <div class="prow">
      <button class="btn-primary">Block</button>
      <button class="btn-plain">Gray out</button>
      <button class="btn-plain">Cancel</button>
    </div>
  </div>

  <div class="browser-toolbar">
    <div class="traffic-lights"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <div class="nav-icons">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 3L5 8l5 5"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".4"><path d="M6 3l5 5-5 5"/></svg>
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.6 8A5.6 5.6 0 112.8 5.2M2.4 2v3.6h3.6"/></svg>
    </div>
    <div class="address-pill">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3.5" y="7" width="9" height="6.5" rx="1.2"/><path d="M5.5 7V4.8a2.5 2.5 0 015 0V7"/></svg>
      example.com
    </div>
    <div class="toolbar-icons">
      <div class="ext-icon-wrap">
        <svg width="26" height="26" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
          <rect width="32" height="32" rx="7" fill="#030307" />
          <line x1="24" y1="8" x2="16" y2="16" stroke="rgba(255,255,255,.55)" stroke-width="2" />
          <line x1="16" y1="16" x2="9" y2="25" stroke="rgba(255,255,255,.55)" stroke-width="2" />
          <line x1="16" y1="16" x2="5.5" y2="11" stroke="rgba(255,255,255,.55)" stroke-width="2" />
          <circle cx="24" cy="8" r="4" fill="#fff" />
          <circle cx="16" cy="16" r="2.8" fill="rgba(255,255,255,.85)" />
          <circle cx="9" cy="25" r="2.2" fill="rgba(255,255,255,.7)" />
          <circle cx="5.5" cy="11" r="2" fill="rgba(255,255,255,.62)" />
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
