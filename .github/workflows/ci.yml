name: CI

on:
  push:
  pull_request:
  # Lets filter-refresh.yml start CI on its bot branch: pushes and PRs made with
  # GITHUB_TOKEN never trigger workflows, but a workflow_dispatch from it does.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run filters:update
      - run: npm run validate:rules
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:firefox
