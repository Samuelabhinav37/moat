name: CI

on:
  push:
  pull_request:
  # Started by sign-live.yml and security-live.yml after their bot commits,
  # which don't trigger push runs.
  workflow_dispatch:

# Read-only token: nothing here writes to the repo or calls the GitHub API.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run filters:update
      - run: npm run validate:rules
      - run: npm run typecheck
      - run: npm run lint
      # samuelabhinav.com/moat/ builds, and every /moat/ link on it resolves.
      - run: npm run site:build
      - run: npm test
      - run: npm run build
      # web-ext lint only validates Firefox; this loads dist/chrome into Chrome
      # for Testing and fails if Chrome rejects it (the 0.11.31-0.11.37 outage).
      - run: npm run check:chrome-load
      # Packing (scripts/pack-rules.mjs) must not change what gets blocked:
      # Chrome's own match results for every 20th listed domain, packed vs
      # original rules, must be identical.
      - run: npm run check:rule-packing -- --sample 20
      # Live checks against local test pages: element hiding, ad-box collapse,
      # pause, "Never block", the cookie rejector switch, a worker cold start.
      - run: npm run smoke
      - run: npm run lint:firefox
      # web-ext lint only checks the Firefox package; this runs it in headless
      # Firefox (preinstalled on the runner) and checks ads and trackers are
      # blocked. Firefox allows 30,000 static rules per extension, and for
      # weeks before 0.11.183 Moat blocked almost no ads there with CI green.
      - run: npm run smoke:firefox
