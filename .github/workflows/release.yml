name: Release

# Two jobs: `build` installs npm packages and runs the build with a
# read-only token and no git credentials on disk; `release` installs
# nothing and only turns the built zips into a draft GitHub Release. A
# compromised package can break the build, but can't push to the repo or
# swap files in a release after the checksums are taken.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          # No npm cache: a release build must not restore anything another
          # workflow could have written (CodeQL actions/cache-poisoning).

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci

      - run: npm run filters:update
      - run: npm run validate:rules
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # web-ext lint only validates Firefox; this loads dist/chrome into Chrome
      # for Testing and fails if Chrome rejects it (the 0.11.31-0.11.37 outage).
      - run: npm run check:chrome-load
      - run: npm run lint:firefox
      - run: npm run smoke:firefox

      - name: Package store zips
        run: npm run zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-zips
          path: |
            chrome.zip
            firefox.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: store-zips

      - name: Compute checksums
        run: sha256sum chrome.zip firefox.zip | tee SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          PKG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## $PKG_VERSION" '
            $0 == ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then
            echo "NOTES_ARGS=--notes-file RELEASE_NOTES.md" >> "$GITHUB_ENV"
          else
            echo "No '## $PKG_VERSION' section found in CHANGELOG.md; falling back to generated notes."
            echo "See CHANGELOG.md for $PKG_VERSION." > RELEASE_NOTES.md
            echo "NOTES_ARGS=--notes-file RELEASE_NOTES.md --generate-notes" >> "$GITHUB_ENV"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            $NOTES_ARGS \
            chrome.zip firefox.zip SHA256SUMS.txt
