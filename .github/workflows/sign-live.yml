name: Sign live fixes

# Signs the live manifest after a change to live/ is merged by a person (a
# report-bot fix, a weekly filter refresh, or a daily security update that
# needed review), then publishes it. Changes merged this way reach every
# install within a day, without a store release.
#
# Only this workflow and security-live.yml hold LIVE_SIGNING_PRIVATE_KEY. A
# pull request never signs live/manifest.json: that's regenerated here, from
# what was merged.
#
# Two jobs: `check` installs npm packages to run the fix-format tests, so it
# gets no key and a read-only token. `sign` installs nothing; it runs only
# scripts/update-live-manifest.mjs, which uses Node's own crypto. A
# compromised npm package can fail the check, but can't reach the key.

on:
  push:
    branches: [master]
    paths:
      - "live/*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-live
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Nothing to do if already signed
        id: check
        run: |
          if node scripts/check-live-manifest.mjs; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check the fixes are well-formed
        if: steps.check.outputs.needed == 'true'
        run: |
          npm ci --ignore-scripts
          npx vitest run src/background/liveFixesData.test.ts src/background/quickFixRules.test.ts src/background/liveCosmeticFixes.test.ts

  sign:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Sign the live manifest
        env:
          LIVE_SIGNING_PRIVATE_KEY: ${{ secrets.LIVE_SIGNING_PRIVATE_KEY }}
        run: |
          node scripts/update-live-manifest.mjs
          node scripts/check-live-manifest.mjs

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/
          git commit -m "live: sign ($(git log -1 --format=%h -- live/))"
          git pull --rebase origin master
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
          gh workflow run publish-live.yml --ref master
          # The merge commit before this one has no .sig, so its CI run fails
          # the signed-manifest tests. Run CI on the signed commit too.
          gh workflow run ci.yml --ref master
