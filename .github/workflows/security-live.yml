name: Daily security lists

# Refreshes live/security-domains.json (phishing, malicious-URL and scam
# domains; see scripts/update-live-security.mjs) once a day, signs the live
# manifest, and publishes it without waiting for a review, so installed
# copies get new phishing domains within a day instead of at the next
# release. What it publishes can only add blocks in the security band, and
# the script's guardrails (well-formed hosts, no IPs, no public suffixes,
# no protected sites) apply every day.
#
# A day that trips the size guardrails (a list that shrank by more than
# half, or more than max(5,000, 25%) domains changed) is NOT published:
# it goes to a pull request on chore/security-live for a person to check.

on:
  schedule:
    - cron: "23 4 * * *" # daily 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: security-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch and check today's lists
        id: fetch
        run: |
          set +e
          node scripts/update-live-security.mjs
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = fine, 3 = needs review; anything else is a failure and
          # leaves the published lists as they are.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
          if [ -n "$(git status --porcelain live/)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Sign the live manifest
        if: steps.fetch.outputs.changed == 'true'
        env:
          LIVE_SIGNING_PRIVATE_KEY: ${{ secrets.LIVE_SIGNING_PRIVATE_KEY }}
        run: node scripts/update-live-manifest.mjs

      - name: Publish
        if: steps.fetch.outputs.changed == 'true' && steps.fetch.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/
          git commit -m "live: daily security lists ($(date -u +%Y-%m-%d))"
          git pull --rebase origin master
          git push origin HEAD:master
          # A push made with the workflow's own token doesn't start other
          # workflows, so start the gh-pages deploy explicitly.
          gh workflow run publish-live.yml --ref master

      - name: Open a pull request for review
        if: steps.fetch.outputs.changed == 'true' && steps.fetch.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="chore/security-live"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          git add live/
          git commit -m "live: security lists need review ($(date -u +%Y-%m-%d))"
          git push -f -u origin "$BR"
          if gh pr view "$BR" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BR; force-push updated it."
          else
            gh pr create --base master --head "$BR" \
              --title "live: security lists need review" \
              --body "Today's security lists changed more than the unattended limits allow (see the workflow log for which list and why). Nothing was published. Look at the diff; merge to publish it, or close to keep the current lists."
          fi
