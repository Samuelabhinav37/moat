name: Publish to stores

# Manual, deliberate, and separate from release.yml (which only builds a draft
# GitHub Release). Dormant until the CWS_* / AMO_* repository secrets exist --
# each store job skips cleanly if its credentials are missing, so this file is
# safe to merge before the secrets are set up. See docs/RELEASING.md.
#
# The build runs in its own job with no store secrets. A step can set
# environment variables and PATH for every later step in its job (through
# $GITHUB_ENV / $GITHUB_PATH), so a compromised npm package in the same job as
# a store upload could read that upload's credentials. Each store gets its own
# job that only receives the built files: the Chrome job runs curl and Node's
# own JSON parsing; the Firefox job installs web-ext alone, at the version the
# lockfile pins, with install scripts off.

on:
  workflow_dispatch:
    # Run it from the tag: "Use workflow from" -> v0.11.54 in the Actions tab,
    # or `gh workflow run publish.yml --ref v0.11.54`. The jobs then run in
    # that tag's own context and check out exactly that tag. Taking the tag as
    # an input instead ran its code with the default branch's cache scope,
    # where it could poison caches other workflows restore (CodeQL
    # actions/cache-poisoning).
    inputs:
      targets:
        description: "Which stores to submit to"
        type: choice
        options: [both, chrome, firefox]
        default: both
      channel:
        description: "stable = public listing; beta = CWS trusted testers + AMO unlisted"
        type: choice
        options: [stable, beta]
        default: stable

# Read-only token: the store uploads use their own secrets, not the
# GitHub token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Only from a release tag
        if: ${{ github.ref_type != 'tag' }}
        run: |
          echo "::error::Run this workflow from a release tag (Use workflow from: vX.Y.Z), not from $GITHUB_REF_NAME"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          # No npm cache: a release build must not restore anything another
          # workflow could have written (CodeQL actions/cache-poisoning).

      - name: Verify the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json v$PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run filters:update
      - run: npm run validate:rules
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # web-ext lint only validates Firefox; this loads dist/chrome into Chrome
      # for Testing and fails if Chrome rejects it (the 0.11.31-0.11.37 outage).
      - run: npm run check:chrome-load
      - run: npm run lint:firefox
      - run: npm run smoke:firefox
      - run: npm run zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-zip
          path: chrome.zip
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firefox-dist
          path: dist/firefox
          retention-days: 7

  # ---- Chrome Web Store (API v2 -- v1 is EOL 2026-10-15) ----------------
  submit-chrome:
    needs: build
    if: ${{ inputs.targets != 'firefox' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chrome-zip

      - name: Submit to the Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$REFRESH_TOKEN" ] || [ -z "$PUBLISHER_ID" ] || [ -z "$EXTENSION_ID" ]; then
            echo "::warning::CWS_* secrets not set -- skipping Chrome Web Store submission."
            exit 0
          fi
          set -euo pipefail
          TOKEN=$(curl -sf -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" -d "grant_type=refresh_token" \
            | node -p "JSON.parse(require('fs').readFileSync(0)).access_token")
          BASE="https://chromewebstore.googleapis.com"
          ITEM="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          echo "Uploading chrome.zip ..."
          # Endpoints verified against developer.chrome.com v2 reference. If the
          # first real run rejects the body, check the v2 media-upload docs for
          # the exact Content-Type / multipart shape and adjust these two flags.
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" --data-binary @chrome.zip \
            "$BASE/upload/v2/$ITEM:upload"
          PUBLISH_URL="$BASE/v2/$ITEM:publish"
          if [ "$CHANNEL" = "beta" ]; then
            PUBLISH_URL="$PUBLISH_URL?publishTarget=trustedTesters"
          fi
          echo "Submitting for review ($PUBLISH_URL) ..."
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{}' "$PUBLISH_URL"
          echo "Chrome Web Store: submitted."

  # ---- Firefox Add-ons (AMO) -------------------------------------------
  submit-firefox:
    needs: build
    if: ${{ inputs.targets != 'chrome' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firefox-dist
          path: dist/firefox

      - name: Submit to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          CHANNEL: ${{ inputs.channel }}
          npm_config_ignore_scripts: "true"
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::warning::AMO_* secrets not set -- skipping AMO submission."
            exit 0
          fi
          set -euo pipefail
          WEB_EXT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/web-ext'].version")
          AMO_CHANNEL=listed
          [ "$CHANNEL" = "beta" ] && AMO_CHANNEL=unlisted
          npx --yes "web-ext@$WEB_EXT_VERSION" sign --channel="$AMO_CHANNEL" \
            --source-dir=dist/firefox \
            --artifacts-dir=web-ext-artifacts
          echo "AMO: submitted for review."
